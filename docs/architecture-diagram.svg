<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ProofJudge Architecture Diagram</title>
  <desc id="desc">Work terms and submitted evidence flow through the settlement console to the EigenCompute judge runtime, which emits a signed DecisionArtifact that can be verified or tamper tested.</desc>
  <rect width="1280" height="720" fill="#0a0b0a"/>
  <g stroke="#293229" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280M0 640H1280"/>
    <path d="M80 0V720M160 0V720M240 0V720M320 0V720M400 0V720M480 0V720M560 0V720M640 0V720M720 0V720M800 0V720M880 0V720M960 0V720M1040 0V720M1120 0V720M1200 0V720"/>
  </g>
  <text x="72" y="82" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">ProofJudge: verifiable acceptance layer</text>
  <text x="72" y="118" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="18">Explicit terms plus submitted evidence produce a signed, inspectable, tamper-evident settlement receipt.</text>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12Z" fill="#37d67a"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="72" y="190" width="210" height="118" rx="8" fill="#101210" stroke="#3a463a"/>
    <text x="98" y="232" fill="#37d67a" font-family="Consolas, monospace" font-size="16" font-weight="700">1. TERMS</text>
    <text x="98" y="264" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Work case</text>
    <text x="98" y="292" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="15">Task terms and rubric</text>

    <rect x="72" y="412" width="210" height="118" rx="8" fill="#101210" stroke="#3a463a"/>
    <text x="98" y="454" fill="#5bb8ff" font-family="Consolas, monospace" font-size="16" font-weight="700">2. EVIDENCE</text>
    <text x="98" y="486" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Submitted work</text>
    <text x="98" y="514" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="15">PR, brief, proposal, vote</text>

    <rect x="406" y="252" width="242" height="218" rx="8" fill="#111711" stroke="#37d67a"/>
    <text x="438" y="298" fill="#37d67a" font-family="Consolas, monospace" font-size="16" font-weight="700">3. EIGENCOMPUTE</text>
    <text x="438" y="334" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Judge runtime</text>
    <text x="438" y="370" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="16">Variant config</text>
    <text x="438" y="398" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="16">Eigen AI Gateway or fallback</text>
    <text x="438" y="426" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="16">Deployment identity</text>

    <rect x="774" y="192" width="230" height="138" rx="8" fill="#101210" stroke="#3a463a"/>
    <text x="804" y="235" fill="#f0b84a" font-family="Consolas, monospace" font-size="16" font-weight="700">4. RECEIPT</text>
    <text x="804" y="268" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">DecisionArtifact</text>
    <text x="804" y="298" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="15">Decision, hashes, signature</text>

    <rect x="774" y="410" width="230" height="138" rx="8" fill="#101210" stroke="#3a463a"/>
    <text x="804" y="453" fill="#b692ff" font-family="Consolas, monospace" font-size="16" font-weight="700">5. SETTLEMENT</text>
    <text x="804" y="486" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Gate action</text>
    <text x="804" y="516" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="15">Release, hold, reject, appeal</text>

    <rect x="1082" y="300" width="142" height="140" rx="8" fill="#101210" stroke="#37d67a"/>
    <text x="1105" y="346" fill="#37d67a" font-family="Consolas, monospace" font-size="16" font-weight="700">VERIFY</text>
    <text x="1105" y="382" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Tamper</text>
    <text x="1105" y="410" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="15">check</text>
  </g>

  <g stroke="#37d67a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M282 250C335 250 344 300 406 316"/>
    <path d="M282 470C338 470 350 422 406 406"/>
    <path d="M648 340C708 314 720 276 774 264"/>
    <path d="M648 404C710 434 720 466 774 480"/>
    <path d="M1004 262C1062 276 1066 336 1082 354"/>
    <path d="M1004 480C1062 464 1066 408 1082 386"/>
  </g>

  <rect x="72" y="614" width="1136" height="54" rx="8" fill="#101210" stroke="#3a463a"/>
  <text x="98" y="648" fill="#edf2ea" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Proof-safe claim:</text>
  <text x="265" y="648" fill="#a3aea2" font-family="Inter, Arial, sans-serif" font-size="18">ProofJudge proves which deployed evaluator produced which decision record and whether it was altered.</text>
</svg>
