name: Live readiness

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: proofjudge-live-readiness
  cancel-in-progress: true

jobs:
  public-demo:
    name: Public demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every public judge
        run: node scripts/live-readiness.mjs
