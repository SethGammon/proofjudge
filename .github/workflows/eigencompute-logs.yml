name: EigenCompute Logs (diagnostic)

# Read-only: fetches an app's status + container logs from EigenCompute.
# No build, no upgrade, no on-chain transaction — safe to run anytime.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which judge to inspect
        type: choice
        options: [code, research, negotiation, governance]
        default: code

env:
  EIGENX_VERSION: v0.2.16

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install eigenx CLI
        run: |
          curl -sL "https://github.com/Layr-Labs/eigenx-cli/releases/download/${EIGENX_VERSION}/eigenx-cli-linux-amd64-${EIGENX_VERSION}.tar.gz" -o eigenx.tgz
          tar xzf eigenx.tgz
          BIN=$(find . -maxdepth 2 -name eigenx -type f | head -1)
          sudo install "$BIN" /usr/local/bin/eigenx

      - name: Fetch info + logs
        env:
          EIGENX_PRIVATE_KEY: ${{ secrets.EIGENX_PRIVATE_KEY }}
        run: |
          case "${{ inputs.app }}" in
            code)        APP=0xd3647631C4706be744BE813cD0226e4f149e5aC0 ;;
            research)    APP=0x898E1d5603070C7452Ee7F8CF288639A63a217cc ;;
            negotiation) APP=0x2f751FcEC35D8afA6fbb2d3486443efcc6CC5322 ;;
            governance)  APP=0x07fB5013B8625af5059Dc1564a964dfBa80Fbd94 ;;
          esac
          echo "::group::eigenx app info ${{ inputs.app }} ($APP)"
          eigenx app info "$APP" --environment mainnet-alpha --disable-telemetry < /dev/null || true
          echo "::endgroup::"
          echo "::group::eigenx app logs ${{ inputs.app }} ($APP)"
          eigenx app logs "$APP" --environment mainnet-alpha --disable-telemetry < /dev/null || true
          echo "::endgroup::"
