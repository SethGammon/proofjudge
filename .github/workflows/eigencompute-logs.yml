name: EigenCompute Logs (diagnostic)

# Read-only: fetches app status (+ container logs for a single app).
# No build, no upgrade, no on-chain transaction — safe to run anytime.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which judge to inspect
        type: choice
        options: [code, research, negotiation, governance, all]
        default: code

env:
  EIGENX_VERSION: v0.2.16

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install eigenx CLI
        run: |
          curl -sL "https://github.com/Layr-Labs/eigenx-cli/releases/download/${EIGENX_VERSION}/eigenx-cli-linux-amd64-${EIGENX_VERSION}.tar.gz" -o eigenx.tgz
          tar xzf eigenx.tgz
          BIN=$(find . -maxdepth 2 -name eigenx -type f | head -1)
          sudo install "$BIN" /usr/local/bin/eigenx

      - name: Fetch info + logs
        env:
          EIGENX_PRIVATE_KEY: ${{ secrets.EIGENX_PRIVATE_KEY }}
        run: |
          declare -A APPS=(
            [code]=0xd3647631C4706be744BE813cD0226e4f149e5aC0
            [research]=0x898E1d5603070C7452Ee7F8CF288639A63a217cc
            [negotiation]=0x2f751FcEC35D8afA6fbb2d3486443efcc6CC5322
            [governance]=0x07fB5013B8625af5059Dc1564a964dfBa80Fbd94
          )
          SEL="${{ inputs.app }}"
          if [ "$SEL" = "all" ]; then NAMES="code research negotiation governance"; else NAMES="$SEL"; fi
          for n in $NAMES; do
            echo "::group::eigenx app info $n (${APPS[$n]})"
            eigenx app info "${APPS[$n]}" --environment mainnet-alpha --disable-telemetry < /dev/null || true
            echo "::endgroup::"
          done
          if [ "$SEL" != "all" ]; then
            echo "::group::eigenx app logs $SEL"
            eigenx app logs "${APPS[$SEL]}" --environment mainnet-alpha --disable-telemetry < /dev/null || true
            echo "::endgroup::"
          fi

      - name: Account overview
        env:
          EIGENX_PRIVATE_KEY: ${{ secrets.EIGENX_PRIVATE_KEY }}
        run: |
          echo "::group::eigenx --version"
          eigenx --version < /dev/null || true
          echo "::endgroup::"
          echo "::group::eigenx auth whoami"
          eigenx auth whoami < /dev/null || true
          echo "::endgroup::"
          echo "::group::eigenx app list (all apps + status)"
          eigenx app list --environment mainnet-alpha --disable-telemetry < /dev/null || true
          echo "::endgroup::"
          echo "::group::eigenx app info code --help (flags available)"
          eigenx app info --help < /dev/null || true
          echo "::endgroup::"
          echo "::group::eigenx app upgrade --help (rollback / image-ref options)"
          eigenx app upgrade --help < /dev/null || true
          echo "::endgroup::"
