name: Deploy to EigenCompute

# Manually triggered: upgrades the live judges to a fresh image in-place,
# preserving each app's identity (app ID / EigenVerify link / IP).
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which judge to upgrade
        type: choice
        options: [all, code, research, negotiation, governance]
        default: all
      image:
        description: Image reference
        default: ghcr.io/sethgammon/proofjudge:latest

env:
  EIGENX_VERSION: v0.2.16

permissions:
  contents: read
  packages: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: code
            id: "0xd3647631C4706be744BE813cD0226e4f149e5aC0"
            env_secret: ENV_CODE
          - name: research
            id: "0x898E1d5603070C7452Ee7F8CF288639A63a217cc"
            env_secret: ENV_RESEARCH
          - name: negotiation
            id: "0x2f751FcEC35D8afA6fbb2d3486443efcc6CC5322"
            env_secret: ENV_NEGOTIATION
          - name: governance
            id: "0x07fB5013B8625af5059Dc1564a964dfBa80Fbd94"
            env_secret: ENV_GOVERNANCE
    steps:
      - name: Install eigenx CLI
        if: inputs.app == 'all' || inputs.app == matrix.name
        run: |
          curl -sL "https://github.com/Layr-Labs/eigenx-cli/releases/download/${EIGENX_VERSION}/eigenx-cli-linux-amd64-${EIGENX_VERSION}.tar.gz" -o eigenx.tgz
          tar xzf eigenx.tgz
          BIN=$(find . -maxdepth 2 -name eigenx -type f | head -1)
          sudo install "$BIN" /usr/local/bin/eigenx

      - name: Log in to GHCR
        if: inputs.app == 'all' || inputs.app == matrix.name
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Upgrade ${{ matrix.name }} judge
        if: inputs.app == 'all' || inputs.app == matrix.name
        env:
          EIGENX_PRIVATE_KEY: ${{ secrets.EIGENX_PRIVATE_KEY }}
          APP_ENV_FILE: ${{ secrets[matrix.env_secret] }}
          APP_ID: ${{ matrix.id }}
          IMAGE_REF: ${{ inputs.image }}
          LAYERED_IMAGE_REF: ${{ inputs.image }}-eigenx
        run: |
          trap 'rm -f app.env' EXIT
          printf '%s' "$APP_ENV_FILE" > app.env
          # eigenx (urfave/cli) stops flag parsing at the first positional arg —
          # options must precede <app-id> <image_ref>. The image-layering
          # confirmation and target-image prompts need a TTY; this pty shim
          # answers them and responds to cursor-position probes emitted by the
          # prompt library.
          python3 - <<'PY'
          import os
          import pty
          import select
          import signal
          import subprocess
          import sys
          import time

          cmd = [
              "eigenx",
              "app",
              "upgrade",
              "--env-file",
              "app.env",
              "--environment",
              "mainnet-alpha",
              "--disable-telemetry",
              "--instance-type",
              "g1-standard-4t",
              "--log-visibility",
              "private",
              "--resource-usage-monitoring",
              "enable",
              os.environ["APP_ID"],
              os.environ["IMAGE_REF"],
          ]

          master_fd, slave_fd = pty.openpty()
          env = os.environ.copy()
          env.setdefault("TERM", "xterm")
          proc = subprocess.Popen(
              cmd,
              stdin=slave_fd,
              stdout=slave_fd,
              stderr=slave_fd,
              env=env,
              start_new_session=True,
          )
          os.close(slave_fd)

          deadline = time.monotonic() + (45 * 60)
          answered_confirmations = set()
          sent_registry = False
          sent_target = False
          last_cursor_reply = 0.0
          transcript = ""
          target_ref = os.environ["LAYERED_IMAGE_REF"]

          while True:
              if time.monotonic() > deadline:
                  print("\nTimed out waiting for eigenx app upgrade.", file=sys.stderr)
                  try:
                      os.killpg(proc.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  sys.exit(124)

              ready, _, _ = select.select([master_fd], [], [], 0.2)
              if master_fd in ready:
                  try:
                      data = os.read(master_fd, 4096)
                  except OSError:
                      data = b""

                  if data:
                      text = data.decode("utf-8", "replace")
                      sys.stdout.write(text)
                      sys.stdout.flush()
                      transcript = (transcript + text)[-4000:]

                      if "\x1b[6n" in transcript:
                          now = time.monotonic()
                          if now - last_cursor_reply > 0.2:
                              os.write(master_fd, b"\x1b[1;1R")
                              last_cursor_reply = now

                      lower = transcript.lower()
                      confirmation_prompts = {
                          "layer": "layer the image with eigenx components",
                          "env": "is this categorization correct",
                      }
                      for prompt_name, prompt_text in confirmation_prompts.items():
                          if prompt_name not in answered_confirmations and prompt_text in lower:
                              os.write(master_fd, b"y\r")
                              answered_confirmations.add(prompt_name)

                      if not sent_registry and "select image destination" in lower:
                          os.write(master_fd, b"\r")
                          sent_registry = True

                      if (
                          not sent_target
                          and (
                              "enter target image reference" in lower
                              or (
                                  "enter image reference" in lower
                                  and "eigenx-compatible version" in lower
                              )
                          )
                      ):
                          print(f"\nSupplying layered image target: {target_ref}")
                          os.write(master_fd, (target_ref + "\r").encode())
                          sent_target = True
                  elif proc.poll() is not None:
                      break

              if proc.poll() is not None:
                  break

          sys.exit(proc.returncode)
          PY
