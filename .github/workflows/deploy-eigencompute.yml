name: Deploy to EigenCompute

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which judge to upgrade
        type: choice
        options: [all, code, research, negotiation, governance]
        default: all

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: code
            id: "0xd3647631C4706be744BE813cD0226e4f149e5aC0"
            env_secret: ENV_CODE
          - name: research
            id: "0x898E1d5603070C7452Ee7F8CF288639A63a217cc"
            env_secret: ENV_RESEARCH
          - name: negotiation
            id: "0x2f751FcEC35D8afA6fbb2d3486443efcc6CC5322"
            env_secret: ENV_NEGOTIATION
          - name: governance
            id: "0x07fB5013B8625af5059Dc1564a964dfBa80Fbd94"
            env_secret: ENV_GOVERNANCE
    steps:
      - name: Checkout the public source commit
        if: inputs.app == 'all' || inputs.app == matrix.name
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upgrade ${{ matrix.name }} from public source
        if: inputs.app == 'all' || inputs.app == matrix.name
        env:
          ECLOUD_PRIVATE_KEY: ${{ secrets.EIGENX_PRIVATE_KEY }}
          APP_ENV_FILE: ${{ secrets[matrix.env_secret] }}
          APP_ID: ${{ matrix.id }}
        run: |
          trap 'rm -f app.env' EXIT
          printf '%s' "$APP_ENV_FILE" | tr -d '\r' > app.env
          if ! grep -q '^PROOFJUDGE_ED25519_PRIVATE_KEY=.' app.env; then
            echo "Deployment blocked: this environment secret has not been upgraded to Ed25519 signing."
            exit 1
          fi
          npx --yes @layr-labs/ecloud-cli@1.0.0 compute app upgrade "$APP_ID" \
            --environment mainnet-alpha \
            --non-interactive \
            --force \
            --verifiable \
            --repo "https://github.com/${GITHUB_REPOSITORY}.git" \
            --commit "$GITHUB_SHA" \
            --build-context . \
            --build-dockerfile Dockerfile \
            --env-file app.env \
            --instance-type g1-standard-4t \
            --log-visibility public \
            --resource-usage-monitoring disable \
            --watch-timeout 900
