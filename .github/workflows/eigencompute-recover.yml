name: EigenCompute Recover (start/stop)

on:
  workflow_dispatch:
    inputs:
      op:
        description: Operation
        type: choice
        options: [start, stop]
        default: start
      app:
        description: Which judge
        type: choice
        options: [research, negotiation, code, governance]
        default: research

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Operate on the selected app with the current EigenCloud CLI
        env:
          ECLOUD_PRIVATE_KEY: ${{ secrets.EIGENX_PRIVATE_KEY }}
          OP: ${{ inputs.op }}
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            code)        APP_ID=0xd3647631C4706be744BE813cD0226e4f149e5aC0 ;;
            research)    APP_ID=0x898E1d5603070C7452Ee7F8CF288639A63a217cc ;;
            negotiation) APP_ID=0x2f751FcEC35D8afA6fbb2d3486443efcc6CC5322 ;;
            governance)  APP_ID=0x07fB5013B8625af5059Dc1564a964dfBa80Fbd94 ;;
          esac
          npx --yes @layr-labs/ecloud-cli@1.0.0 compute app info "$APP_ID" --environment mainnet-alpha --non-interactive
          npx --yes @layr-labs/ecloud-cli@1.0.0 compute app "$OP" "$APP_ID" --environment mainnet-alpha --non-interactive --force
          npx --yes @layr-labs/ecloud-cli@1.0.0 compute app info "$APP_ID" --environment mainnet-alpha --non-interactive
